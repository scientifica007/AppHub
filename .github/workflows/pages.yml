name: Validate and deploy AppHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * *'

permissions:
  contents: write

concurrency:
  group: apphub-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Miqat JavaScript and calendar
        run: |
          node --check miqat/assets/app.js
          node --check miqat/assets/calendar.js
          node --check miqat/scripts/monitor.mjs
          node --test miqat/tests/*.test.mjs
      - name: Watch moon-sighting headlines (links only, never auto-approve)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node miqat/scripts/monitor.mjs
      - name: Commit monitored headline feed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miqat/data/headlines.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Miqat moon-sighting headline candidates"
            git push
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
